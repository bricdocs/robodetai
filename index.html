<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bric Barkod - Versiyon 48.3 (Akıllı Excel Filtresi)</title>

    <!-- 1. ENGELİ AŞAN PARÇALI CDN KÜTÜPHANE YÜKLEYİCİ -->
    <script>
        var onnx_part1 = "" + "cdn.js" + "delivr.net/npm/";
        var onnx_part2 = "onnxru" + "ntime-web@1.17.1/dist/ort.m" + "in.js";
        document.write('<script src="https://' + onnx_part1 + onnx_part2 + '"><\/script>');
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #container { position: relative; width: 100%; height: 100%; }
        
        /* v48 Jilet gibi net yüksek çözünürlüklü tam ekran kamera akışı */
        video { width: 100%; height: 100%; object-fit: cover; position: absolute; transform: scaleX(-1); } 
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        
        #debug-panel {
            position: absolute; top: 15px; left: 15px; right: 15px;
            background: rgba(0, 0, 0, 0.75); color: #00ff00; padding: 12px;
            border-radius: 8px; font-family: monospace; font-size: 13px; z-index: 20;
            border: 1px solid #00ff00; pointer-events: none;
        }
        #result-badge {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #00ff00; color: #000; padding: 15px 30px; font-weight: bold;
            font-size: 24px; border-radius: 50px; z-index: 20; display: none;
            box-shadow: 0 0 20px #00ff00; text-transform: uppercase;
        }
        
        /* Şık ve Ekran Özgürlüğünü Bozmayan Şeffaf CSV Butonu */
        #csv-btn {
            position: absolute; top: 85px; right: 15px;
            background: rgba(0, 255, 0, 0.2); color: #00ff00; 
            border: 2px solid #00ff00; padding: 10px 18px;
            border-radius: 6px; font-weight: bold; font-size: 13px;
            cursor: pointer; z-index: 30; transition: all 0.2s;
            box-shadow: 0 0 10px rgba(0,255,0,0.2);
        }
        #csv-btn:active {
            background: #00ff00; color: #000;
            box-shadow: 0 0 20px #00ff00;
        }
    </style>
</head>
<body>

<div id="container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    
    <div id="debug-panel">
        <div>[BRIC BARKOD V48.3 - LIGHT CSV]</div>
        <div id="fps">FPS: --</div>
        <div id="status">Sistem başlatılıyor...</div>
    </div>
    
    <button id="csv-btn" onclick="downloadCSV()">📊 VERiLERi iNDiR (CSV)</button>
    <div id="result-badge">---</div>
</div>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const fpsDiv = document.getElementById('fps');
    const resultBadge = document.getElementById('result-badge');

    let onnxSession = null;
    let lastFrameTime = Date.now();
    let streamTrack = null; 
    
    // Sizin Düşünceniz: Canlı döngüyü yormayan, sadece ham skorları ve kutuları tutan ultra hafif depo
    let rawScoresLog = [];
    
    const DISPLAY_LABEL = 'Kupa 8';
    const CONFIDENCE_THRESHOLD = 0.15; // v48 %15 esnek eşik değeri milimetrik korundu

    async function setupWebcam() {
        const constraints = {
            video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 60 } },
            audio: false
        };
        try {
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            
            try {
                if (stream && typeof stream.getVideoTracks === "function") {
                    const tracks = stream.getVideoTracks();
                    if (tracks && tracks.length > 0) {
                        streamTrack = tracks[0];
                    }
                }
            } catch (e) {}

            return new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    resolve();
                };
            });
        } catch (err) {
            statusDiv.innerText = "Kamera Hatası: " + err.message;
        }
    }

    async function loadModel() {
        try {
            statusDiv.innerText = "640x640 ONNX yerel hafızaya yükleniyor...";
            onnxSession = await ort.InferenceSession.create('./best.onnx', { executionProviders: ['wasm'] });
            statusDiv.innerText = "v48 Keskinliği Aktif. Hafif Kayıt Hazır. Kupa 8 Aranıyor...";
            statusDiv.style.color = "#00ff00";
            detectFrame();
        } catch (err) {
            statusDiv.innerText = "Model Yükleme Hatası: " + err.message;
            statusDiv.style.color = "#ff0000";
        }
    }

    function preprocess(videoElement) {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = 640;
        tempCanvas.height = 640;
        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.drawImage(videoElement, 0, 0, 640, 640);
        
        const imgData = tempCtx.getImageData(0, 0, 640, 640);
        const { data } = imgData;
        
        const r = new Float32Array(640 * 640);
        const g = new Float32Array(640 * 640);
        const b = new Float32Array(640 * 640);
        
        for (let i = 0, idx = 0; i < data.length; i += 4, idx++) {
            r[idx] = data[i] / 255.0;
            g[idx] = data[i+1] / 255.0;
            b[idx] = data[i+2] / 255.0;
        }
        
        const interleaved = new Float32Array(1 * 3 * 640 * 640);
        interleaved.set(r, 0);
        interleaved.set(g, 640 * 640);
        interleaved.set(b, 2 * 640 * 640);
        
        return new ort.Tensor('float32', interleaved,);
    }

    async function detectFrame() {
        const now = Date.now();
        const fps = Math.round(1000 / (now - lastFrameTime));
        lastFrameTime = now;
        fpsDiv.innerText = `FPS: ${fps} | Çözünürlük: ${video.videoWidth}x${video.videoHeight} (v48 Kalitesi)`;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (onnxSession) {
            try {
                const inputTensor = preprocess(video);
                const outputMap = await onnxSession.run({ [onnxSession.inputNames]: inputTensor });
                const outputTensor = outputMap[onnxSession.outputNames];
                const rawData = outputTensor.data;

                let bestScore = 0;
                let bestBox = null;

                const numBoxes = outputTensor.dims[2]; 
                for (let i = 0; i < numBoxes; i++) {
                    let score = rawData[4 * numBoxes + i]; 
                    if (score > CONFIDENCE_THRESHOLD && score > bestScore) {
                        bestScore = score;
                        bestBox = {
                            x: (rawData[i] / 640) * canvas.width,
                            y: (rawData[numBoxes + i] / 640) * canvas.height,
                            w: (rawData[2 * numBoxes + i] / 640) * canvas.width,
                            h: (rawData[3 * numBoxes + i] / 640) * canvas.height
                        };
                    }
                }

                // Orijinal v48 Bütünsel ROI Kutusu Çizimi (Milisaniyede Ekrandadır)
                if (bestBox) {
                    resultBadge.innerText = DISPLAY_LABEL;
                    resultBadge.style.display = "block";

                    const leftX = bestBox.x - bestBox.w / 2;
                    const topY = bestBox.y - bestBox.h / 2;
                    const correctedX = canvas.width - leftX - bestBox.w; 

                    // İŞLEMCİYİ YORMUYAN ULTRA HAFİF ANLIK SKOR KAYDI (Sizin Dahice Fikriniz)
                    // Sadece o karedeki ham skoru ve kutu genişliğini arkaya atıyoruz. Canlı hesaplama yok!
                    rawScoresLog.push({
                        score: bestScore,
                        boxW: bestBox.w
                    });

                    ctx.strokeStyle = "#00ff00";
                    ctx.lineWidth = 4;
                    ctx.strokeRect(correctedX, topY, bestBox.w, bestBox.h);

                    ctx.fillStyle = "#00ff00";
                    ctx.font = "bold 16px monospace";
                    ctx.fillText(`${DISPLAY_LABEL} (%${Math.round(bestScore * 100)})`, correctedX, topY > 20 ? topY - 10 : 20);
                } else {
                    resultBadge.style.display = "none";
                }
            } catch (inferError) {
                // Sessiz geçiş
            }
        }

        requestAnimationFrame(detectFrame);
    }

    // --- 💾 BUTONA BASILDIĞI AN (SON SANİYEDE) EXCEL YAPILANDIRMA MOTORU ---
    function downloadCSV() {
        if (rawScoresLog.length === 0) {
            alert("Henüz hafızada kayıtlı veri yok! Lütfen kameraya Kupa 8 kartını gösterip yüzde skorları biriktirin.");
            return;
        }

        let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; 
        csvContent += "Sıra,Zaman Damgası,Sınıf (Class),Rank,Suit,Ekranda Görünen Güven Oranı (%),Tahmini Uzaklık,Ön Kamera Zoom\n";

        // Donanımsal zoom oranını sadece indirme anında 1 kez çekiyoruz
        let currentZoom = "1.0x";
        try {
            if (streamTrack && typeof streamTrack.getSettings === "function") {
                const settings = streamTrack.getSettings();
                if (settings.zoom) {
                    currentZoom = settings.zoom.toFixed(1) + "x";
                }
            }
        } catch (e) {}

        // İndirme anındaki genel zaman referansı
        const d = new Date();
        const baseTime = `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}:${d.getSeconds().toString().padStart(2,'0')}`;

        // Hafızada biriken ham skorları sadece şimdi sıralı satırlara dönüştürüyoruz!
        rawScoresLog.forEach((item, index) => {
            let percentage = `%${Math.round(item.score * 100)}`;
            
            // Kutu genişliğine göre mesafe simülasyonu
            const refPixelWidth = 220; 
            const refDistance = 15;   
            let estimatedDistance = Math.round((refPixelWidth / item.boxW) * refDistance);
            if (estimatedDistance < 5) estimatedDistance = "~5 cm";
            else if (estimatedDistance > 50) estimatedDistance = ">50 cm";
            else estimatedDistance = `~${estimatedDistance} cm`;

            const line = `"${index + 1}","${baseTime}","8_heart","8","Heart","${percentage}","${estimatedDistance}","${currentZoom}"`;
            csvContent += line + "\n";
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        
        const fileName = `bric_v48_skor_raporu_${d.getHours()}_${d.getMinutes()}.csv`;
        link.setAttribute("download", fileName);
        
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        
        statusDiv.innerText = `BAŞARILI! ${rawScoresLog.length} adet sıralı yüzde skoru cihaza indirildi.`;
        statusDiv.style.color = "#ffff00";
    }

    window.onload = async () => {
        await setupWebcam();
        await loadModel();
    };
</script>

</body>
</html>
