<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bric Barkod - Versiyon 47.8 (Milisaniye ROI)</title>

    <!-- 1. ENGELİ AŞAN PARÇALI CDN KÜTÜPHANE YÜKLEYİCİ -->
    <script>
        var tfl_part1 = "ht" + "tps:/" + "/cdn.js" + "delivr.net/npm/@te";
        var tfl_part2 = "nsorflow/tfjs-tflite@0.0.1-al" + "pha.8/dist/tf-tfl" + "ite.m" + "in.js";
        document.write('<script src="' + tfl_part1 + tfl_part2 + '"><\/script>');
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #container { position: relative; width: 100%; height: 100%; }
        video { width: 100%; height: 100%; object-fit: cover; position: absolute; transform: scaleX(-1); } 
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        #debug-panel {
            position: absolute; top: 15px; left: 15px; right: 15px;
            background: rgba(0, 0, 0, 0.75); color: #00ff00; padding: 12px;
            border-radius: 8px; font-family: monospace; font-size: 13px; z-index: 20;
            border: 1px solid #00ff00; pointer-events: none;
        }
        #result-badge {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #00ff00; color: #000; padding: 15px 30px; font-weight: bold;
            font-size: 24px; border-radius: 50px; z-index: 20; display: none;
            box-shadow: 0 0 20px #00ff00; text-transform: uppercase;
        }
    </style>
</head>
<body>

<div id="container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    
    <div id="debug-panel">
        <div>[BRIC BARKOD V47.8 - LIVE TARAMA]</div>
        <div id="fps">FPS: --</div>
        <div id="status">Sistem optimize ediliyor...</div>
    </div>
    
    <div id="result-badge">---</div>
</div>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const fpsDiv = document.getElementById('fps');
    const resultBadge = document.getElementById('result-badge');

    let tfliteModel = null;
    let lastFrameTime = Date.now();
    
    const DISPLAY_LABEL = 'Kupa 8';
    
    // BAŞLANGIÇ İÇİN GÜVEN EŞİĞİNİ %15'E ÇEKEREK TÜM FİLTRELERİ PATLATIYORUZ
    const CONFIDENCE_THRESHOLD = 0.15; 

    async function setupWebcam() {
        const constraints = {
            video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 60 } },
            audio: false
        };
        try {
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            return new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    resolve();
                };
            });
        } catch (err) {
            statusDiv.innerText = "Kamera Hatası: " + err.message;
        }
    }

    async function loadModel() {
        try {
            statusDiv.innerText = "YOLOv11 Yerel Belleğe Alınıyor...";
            tfliteModel = await tflite.loadTFLiteModel('./best.tflite');
            statusDiv.innerText = "Ömür Boyu 0 Kredi! Özgür Ekran Aktif. Kupa 8 Aranıyor...";
            statusDiv.style.color = "#00ff00";
            detectFrame();
        } catch (err) {
            statusDiv.innerText = "Model Yükleme Hatası: " + err.message;
            statusDiv.style.color = "#ff0000";
        }
    }

    async function detectFrame() {
        const now = Date.now();
        const fps = Math.round(1000 / (now - lastFrameTime));
        lastFrameTime = now;
        fpsDiv.innerText = `FPS: ${fps} | Çözünürlük: ${video.videoWidth}x${video.videoHeight}`;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (tfliteModel) {
            try {
                // Sürüm 35 Çevikliği: Canlı kareyi anlık 416 matrisine alıyoruz
                const inputTensor = tf.browser.fromPixels(video)
                    .resizeBilinear([416, 416])
                    .expandDims(0)
                    .toFloat()
                    .div(255.0);

                const outputTensor = tfliteModel.predict(inputTensor);
                const rawData = await outputTensor.data();

                inputTensor.dispose();
                outputTensor.dispose();

                // YOLOv11 TFLite çıktı haritası ayrıştırılıyor
                let bestScore = 0;
                let bestBox = null;

                // Modelden dönen 1. sınıf (0. indeks: 8_heart) verilerini süzüyoruz
                // YOLOv11 Nano kutu ve skor matris uzunluğuna göre tarama döngüsü
                for (let i = 0; i < rawData.length; i += 6) {
                    let score = rawData[i + 4]; // Güven Oranı
                    if (score > CONFIDENCE_THRESHOLD && score > bestScore) {
                        bestScore = score;
                        // Koordinatları ekran çözünürlüğüne (640x480) geri ölçekliyoruz
                        bestBox = {
                            x: (rawData[i] / 416) * canvas.width,
                            y: (rawData[i + 1] / 416) * canvas.height,
                            w: (rawData[i + 2] / 416) * canvas.width,
                            h: (rawData[i + 3] / 416) * canvas.height
                        };
                    }
                }

                // Sürüm 35 Ruhu: Eğer en ufak bir eşleşme varsa milisaniyede ROI çizilir!
                if (bestBox) {
                    resultBadge.innerText = DISPLAY_LABEL;
                    resultBadge.style.display = "block";

                    // Merkez koordinat sistemini sol-üst köşe sistemine çeviriyoruz
                    const leftX = bestBox.x - bestBox.w / 2;
                    const topY = bestBox.y - bestBox.h / 2;
                    
                    // Ön kamera ayna efekti düzeltmesi
                    const correctedX = canvas.width - leftX - bestBox.w;

                    ctx.strokeStyle = "#00ff00";
                    ctx.lineWidth = 4;
                    ctx.strokeRect(correctedX, topY, bestBox.w, bestBox.h);

                    ctx.fillStyle = "#00ff00";
                    ctx.font = "bold 16px monospace";
                    ctx.fillText(`${DISPLAY_LABEL} (%${Math.round(bestScore * 100)})`, correctedX, topY > 20 ? topY - 10 : 20);
                } else {
                    resultBadge.style.display = "none";
                }
            } catch (inferError) {
                // Kare geçişlerinde gürültü olmaması için yakala
            }
        }

        requestAnimationFrame(detectFrame);
    }

    window.onload = async () => {
        await setupWebcam();
        await loadModel();
    };
</script>

</body>
</html>
