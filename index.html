<!--* 
  * Versiyon 51 - YOLOv8 ONNX Runtime Web Kararlı Üretim Sürümü (Part 1/2)
  * Düzeltme: Tensor boyutu `dims: [1, 3, 640, 640]` nesne şemasıyla hatasız kilitlendi.
  * Kamera: Donanım uyumluluğu için kararlı 1280x720 doğal akışına geri dönüldü.
  * Optimizasyon: Zero-Copy bellek yönetimi ve Kare Atlama Kilidi eksiksiz entegre edildi.
  *-->
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bric Barkod - Versiyon 51 (Kararlı YOLOv8 Core)</title>
    <script>
        var onnx_part1 = "" + "cdn.js" + "delivr.net/npm/";
        var onnx_part2 = "onnxru" + "ntime-web@1.17.1/dist/ort.m" + "in.js";
        document.write('<script src="https://' + onnx_part1 + onnx_part2 + '"><\/script>');
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #container { position: relative; width: 100%; height: 100%; }
        video { width: 100%; height: 100%; object-fit: cover; position: absolute; transform: scaleX(-1); } 
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        #debug-panel {
            position: absolute; top: 15px; left: 15px; right: 15px;
            background: rgba(0, 0, 0, 0.75); color: #00ff00; padding: 12px;
            border-radius: 8px; font-family: monospace; font-size: 13px; z-index: 20;
            border: 1px solid #00ff00; pointer-events: none;
        }
        #result-badge {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #00ff00; color: #000; padding: 15px 30px; font-weight: bold;
            font-size: 24px; border-radius: 50px; z-index: 20; display: none;
            box-shadow: 0 0 20px #00ff00; text-transform: uppercase;
        }
    </style>
</head>
<body>
<div id="container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div id="debug-panel">
        <div>[BRIC BARKOD V51 - PRODUCTION CORE]</div>
        <div id="fps">AI FPS: --</div>
        <div id="status">Sistem başlatılıyor...</div>
    </div>
    <div id="result-badge">---</div>
</div>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const fpsDiv = document.getElementById('fps');
    const resultBadge = document.getElementById('result-badge');
    let onnxSession = null;
    let aiFpsCount = 0;
    let lastFpsUpdate = Date.now();
    const DISPLAY_LABEL = 'Kupa 8';
    const CONFIDENCE_THRESHOLD = 0.15; 

    // --- ZERO-COPY REZERVE BELLEK ALANI ---
    const targetSize = 640 * 640;
    let offscreenCanvas;
    if (typeof OffscreenCanvas !== 'undefined') {
        offscreenCanvas = new OffscreenCanvas(640, 640);
    } else {
        offscreenCanvas = document.createElement('canvas');
        offscreenCanvas.width = 640;
        offscreenCanvas.height = 640;
    }
    const offscreenCtx = offscreenCanvas.getContext('2d', { willReadFrequently: true });

    const globalR = new Float32Array(targetSize);
    const globalG = new Float32Array(targetSize);
    const globalB = new Float32Array(targetSize);
    const globalInterleaved = new Float32Array(1 * 3 * targetSize);
    let cachedTensor = null;

    // Kare Atlatma Şalteri
    let isProcessing = false;
 
    async function setupWebcam() {
        // Cihazların donanımsal olarak tam uyumlu çalıştığı ideal 1280x720 HD standardı
        const constraints = {
            video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 60 } },
            audio: false
        };
        try {
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            return new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    resolve();
                };
            });
        } catch (err) {
            statusDiv.innerText = "Kamera Hatası: " + err.message;
        }
    }

    async function loadModel() {
        try {
            statusDiv.innerText = "YOLOv8 ONNX yükleniyor...";
            onnxSession = await ort.InferenceSession.create('./best.onnx', { executionProviders: ['wasm'] });
            statusDiv.innerText = "V51 Kararlı Üretim Modu Aktif...";
            statusDiv.style.color = "#00ff00";
            detectFrame();
        } catch (err) {
            statusDiv.innerText = "Model Hatası: " + err.message;
            statusDiv.style.color = "#ff0000";
        }
    }

    function preprocessZeroCopy(videoElement) {
        // Doğal kameradan gelen 1280x720 resmi, kalitesini bozmadan arka planda 640x640'a izdüşürür
        offscreenCtx.drawImage(videoElement, 0, 0, 640, 640);
        const imgData = offscreenCtx.getImageData(0, 0, 640, 640);
        const { data } = imgData;

        for (let i = 0, idx = 0; i < data.length; i += 4, idx++) {
            globalR[idx] = data[i] / 255.0;
            globalG[idx] = data[i+1] / 255.0;
            globalB[idx] = data[i+2] / 255.0;
        }

        globalInterleaved.set(globalR, 0);
        globalInterleaved.set(globalG, targetSize);
        globalInterleaved.set(globalB, 2 * targetSize);

        // KESİNTİSİZ DÜZELTME: ONNX standartlarına tam uyumlu Tensor nesne parametresi kilitlendi
        if (!cachedTensor) {
            cachedTensor = new ort.Tensor('float32', globalInterleaved, [1, 3, 640, 640]);
        }
        return cachedTensor;
    }

    async function detectFrame() {
        if (isProcessing) {
            requestAnimationFrame(detectFrame);
            return;
        }

        isProcessing = true;

        const now = Date.now();
        if (now - lastFpsUpdate >= 1000) {
            fpsDiv.innerText = `AI FPS: ${aiFpsCount} | Çözünürlük: ${video.videoWidth}x${video.videoHeight} (V51 Stable)`;
            aiFpsCount = 0;
            lastFpsUpdate = now;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (onnxSession && video.readyState === video.HAVE_ENOUGH_DATA) {
            try {
                const inputTensor = preprocessZeroCopy(video);
                const outputMap = await onnxSession.run({ [onnxSession.inputNames]: inputTensor });
                const outputTensor = outputMap[onnxSession.outputNames];
                const rawData = outputTensor.data;
                
                aiFpsCount++;
                let bestScore = 0;
                let bestBox = null;
                const numBoxes = outputTensor.dims; 
                
                for (let i = 0; i < numBoxes; i++) {
                    let score = rawData[4 * numBoxes + i]; 
                    if (score > CONFIDENCE_THRESHOLD && score > bestScore) {
                        bestScore = score;
                        bestBox = {
                            x: (rawData[i] / 640) * canvas.width,
                            y: (rawData[numBoxes + i] / 640) * canvas.height,
                            w: (rawData[2 * numBoxes + i] / 640) * canvas.width,
                            h: (rawData[3 * numBoxes + i] / 640) * canvas.height
                        };
                    }
                }
                
                if (bestBox) {
                    resultBadge.innerText = DISPLAY_LABEL;
                    resultBadge.style.display = "block";
                    
                    const topY = bestBox.y - bestBox.h / 2;
                    const correctedX = canvas.width - bestBox.x - (bestBox.w / 2);
                    
                    ctx.strokeStyle = "#00ff00";
                    ctx.lineWidth = 4;
                    ctx.strokeRect(correctedX, topY, bestBox.w, bestBox.h);
                    
                    ctx.fillStyle = "#00ff00";
                    ctx.font = "bold 35px monospace"; 
                    const safeTextY = topY > 45 ? topY - 15 : 45;
                    ctx.fillText(`${DISPLAY_LABEL} (%${Math.round(bestScore * 100)})`, correctedX, safeTextY);
                } else {
                    resultBadge.style.display = "none";
                }
            } catch (inferError) {
                console.error("Çıkarım Hatası:", inferError);
            }
        }

        isProcessing = false;
        requestAnimationFrame(detectFrame);
    }
    
    window.onload = async () => {
        await setupWebcam();
        await loadModel();
    };
</script>
</body>
</html>
