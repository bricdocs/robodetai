<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bric Barkod - Real-Time AI Scanner</title>
    
    <!-- 1. ENGELİ AŞAN PARÇALI CDN KÜTÜPHANE YÜKLEYİCİ -->
    <script>
        // ONNX Runtime Web - Kararlı 1.17.1 Sürümü
        var onnx_part1 = "https://" + "cdn.js" + "delivr.net/npm/";
        var onnx_part2 = "onnxru" + "ntime-web@1.17.1/dist/ort.m" + "in.js";
        document.write('<script src="' + onnx_part1 + onnx_part2 + '"><\/script>');

        // Tailwind CSS v4 - Doğru ve Çalışan index.global.js Dağıtım Yolu
        var tw_part1 = "https://" + "cdn.js" + "delivr.net/npm/@tail" + "windcss/browser";
        var tw_part2 = "@4.0.0-alpha.32/dist/in" + "dex.glo" + "bal.js";
        document.write('<script src="' + tw_part1 + tw_part2 + '"><\/script>');
    </script>

    <!-- Favicon 404 Konsol Uyarısını Susturan Hat -->
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    
    <style>
        /* Görüntü kozmetik olarak düz (Aynalama tamamen kapalı) */
        video, canvas {
            transform: scaleX(1);
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="relative w-full max-w-xl bg-gray-800 rounded-2xl overflow-hidden shadow-2xl border border-gray-700">
        <!-- Video Akışı ve Çizim Katmanları -->
        <video id="webcam" autoplay playsinline muted class="w-full h-auto block"></video>
        <canvas id="overlay" class="absolute top-0 left-0 w-full h-full pointer-events-none"></canvas>
        
        <!-- Dinamik Durum Paneli -->
        <div id="status" class="absolute top-4 left-4 bg-black/70 px-4 py-2 rounded-full text-xs font-semibold tracking-wider flex items-center gap-2 border border-yellow-500/50 text-yellow-400">
            <span class="w-2 h-2 rounded-full bg-yellow-400 animate-ping"></span>
            Yapay Zeka Modeli Yükleniyor...
        </div>
    </div>

    <!-- 2. ANA YAPAY ZEKA VE KAMERA MOTORU SCRIPT BLOKU -->
    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('overlay');
        
        // 3 saniyelik CPU-GPU gecikmesini ve tarayıcı uyarısını bitiren kesin çözüm
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const statusDiv = document.getElementById('status');
        
        let session = null;
        const modelInputWidth = 640;
        const modelInputHeight = 640;

        // Kamera Kurulumu (Güvenli Fallback Mekanizmalı)
        async function setupCamera() {
            const constraintsOptions = [
                { video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
                { video: { facingMode: 'environment' }, audio: false },
                { video: true, audio: false }
            ];

            let stream = null;
            let lastError = null;

            for (const constraints of constraintsOptions) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                    if (stream) break;
                } catch (err) {
                    lastError = err;
                    console.warn("Kamera ayarı denenirken geçici hata oluştu, fallback deneniyor...", err);
                }
            }

            if (!stream) {
                console.error("Tüm kamera açma varyasyonları başarısız oldu:", lastError);
                statusDiv.innerText = "Kamera Başlatılamadı! İzinleri veya diğer sekmeleri kontrol edin.";
                statusDiv.className = "absolute top-4 left-4 bg-red-600 px-4 py-2 rounded-full text-xs font-bold text-white border border-red-800";
                throw lastError;
            }

            video.srcObject = stream;
            return new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    resolve();
                };
            });
        }

        // ONNX Yapay Zeka Modelini Belleğe Alma (bric-barkod Firebase Kök Dizini)
        async function loadModel() {
            try {
                session = await ort.InferenceSession.create('./model.onnx', { executionProviders: ['wasm'] });
                statusDiv.innerHTML = '<span class="w-2 h-2 rounded-full bg-green-500"></span> Canlı AI Aktif';
                statusDiv.className = "absolute top-4 left-4 bg-green-950/80 px-4 py-2 rounded-full text-xs font-semibold tracking-wider flex items-center gap-2 border border-green-500/50 text-green-400";
            } catch (err) {
                console.error("Model yüklenemedi:", err);
                statusDiv.innerText = "Model Dosyası (model.onnx) Bulunamadı!";
            }
        }

                // Kesin 4 Boyutlu JavaScript Tensor Paketleme Motoru
        function preprocess(videoFrame, targetWidth, targetHeight) {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = targetWidth;
            tempCanvas.height = targetHeight;
            const tempCtx = tempCanvas.getContext('2d', { willReadFrequently: true });
            
            tempCtx.drawImage(videoFrame, 0, 0, targetWidth, targetHeight);
            const imgData = tempCtx.getImageData(0, 0, targetWidth, targetHeight);
            const { data } = imgData;

            // NCHW Planar Düzeni İçin Kanalları Ayırma
            const rChannel = new Float32Array(targetWidth * targetHeight);
            const gChannel = new Float32Array(targetWidth * targetHeight);
            const bChannel = new Float32Array(targetWidth * targetHeight);

            for (let i = 0; i < data.length; i += 4) {
                const pixelIndex = i / 4;
                rChannel[pixelIndex] = data[i] / 255.0;     // R
                gChannel[pixelIndex] = data[i + 1] / 255.0; // G
                bChannel[pixelIndex] = data[i + 2] / 255.0; // B
            }

            const floatData = new Float32Array(3 * targetWidth * targetHeight);
            floatData.set(rChannel, 0);
            floatData.set(gChannel, targetWidth * targetHeight);
            floatData.set(bChannel, 2 * targetWidth * targetHeight);

            // 4 Boyutlu Tensor Nesnesi Sınırları Çizildi
            return new ort.Tensor('float32', floatData, [1, 3, targetWidth, targetHeight]);
        }

        // Parlak Yeşil ROI Çizim Motoru
        function drawBoundingBox(bestBox) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (!bestBox) return;

            ctx.strokeStyle = '#00FF00';
            ctx.lineWidth = 4;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00FF00';

            ctx.beginPath();
            ctx.rect(bestBox.x, bestBox.y, bestBox.w, bestBox.h);
            ctx.stroke();

            ctx.shadowBlur = 0; // Bir sonraki kare için gölgeyi sıfırla
        }

        // Düz Görüntü Formülü (Aynalama Kaldırılmış Saf Çözümleme)
        function parseYOLOv8Output(outputTensor, canvasWidth, canvasHeight) {
            const data = outputTensor.data;
            const numAttributes = outputTensor.dims[1]; 
            const numBoxes = outputTensor.dims[2]; 

            let highestScore = 0;
            let bestBox = null;
            const scoreThreshold = 0.45; 

            for (let i = 0; i < numBoxes; i++) {
                let classScore = 0;
                for (let j = 4; j < numAttributes; j++) {
                    const score = data[j * numBoxes + i];
                    if (score > classScore) classScore = score;
                }

                if (classScore > scoreThreshold && classScore > highestScore) {
                    highestScore = classScore;

                    let cx = data[0 * numBoxes + i];
                    let cy = data[1 * numBoxes + i];
                    let w  = data[2 * numBoxes + i];
                    let h  = data[3 * numBoxes + i];

                    // 640 tabanlı pikselleri oranlamak için normalizasyon kontrolü
                    if (cx > 1) { cx /= modelInputWidth; cy /= modelInputHeight; w /= modelInputWidth; h /= modelInputHeight; }

                    // Düz yansıtma (scaleX(1)) için ekransal merkez dönüşüm formülü
                    const actualW = w * canvasWidth;
                    const actualH = h * canvasHeight;
                    const actualX = (cx * canvasWidth) - (actualW / 2);
                    const actualY = (cy * canvasHeight) - (actualH / 2);

                    bestBox = { x: actualX, y: actualY, w: actualW, h: actualH };
                }
            }
            return bestBox;
        }

        // Real-Time Video Döngüsü
        async function processVideo() {
            if (video.paused || video.ended || !session) {
                requestAnimationFrame(processVideo);
                return;
            }

            try {
                const inputTensor = preprocess(video, modelInputWidth, modelInputHeight);
                const inputName = session.inputNames[0];
                const feeds = {};
                feeds[inputName] = inputTensor;

                const outputs = await session.run(feeds);
                const outputName = session.outputNames[0];
                const outputTensor = outputs[outputName];

                const bestBox = parseYOLOv8Output(outputTensor, canvas.width, canvas.height);
                drawBoundingBox(bestBox);

            } catch (err) {
                console.error("Döngü hatası:", err);
            }

            requestAnimationFrame(processVideo);
        }

        // Başlatıcı
        async function main() {
            try {
                await setupCamera();
                await loadModel();
                processVideo();
            } catch (e) {
                console.error("Sistem başlatılamadı:", e);
            }
        }

        window.addEventListener('DOMContentLoaded', main);
    </script>
</body>
</html>
