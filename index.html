<!-- BRIC BARKOD - VERSIYON 18 -->
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bric Barkod - Real-Time AI Scanner (V18)</title>
    
    <!-- TÜM RİSKLİ VE GÜVENSİZ BULUNAN SERVICE WORKER KODLARI TAMAMEN TEMİZLENDİ -->

    <!-- 1. ENGELİ AŞAN PARÇALI CDN KÜTÜPHANE YÜKLEYİCİ -->
    <script>
        var onnx_part1 = "https://" + "cdn.js" + "delivr.net/npm/";
        var onnx_part2 = "onnxru" + "ntime-web@1.17.1/dist/ort.m" + "in.js";
        document.write('<script src="' + onnx_part1 + onnx_part2 + '"><\/script>');

        var tw_part1 = "https://" + "cdn.js" + "delivr.net/npm/@tail";
        var tw_part2 = "windcss/br" + "owser@4";
        document.write('<script src="' + tw_part1 + tw_part2 + '"><\/script>');
    </script>

    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    
    <style>
        /* Görüntü kozmetik olarak düz (Aynalama tamamen kapalı) */
        video, canvas {
            transform: scaleX(1);
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4 select-none">

    <div class="relative w-full max-w-xl bg-gray-800 rounded-2xl overflow-hidden shadow-2xl border border-gray-700">
        <video id="webcam" autoplay playsinline muted class="w-full h-auto block"></video>
        <canvas id="overlay" class="absolute top-0 left-0 w-full h-full pointer-events-none"></canvas>
        
        <!-- Dinamik Durum Paneli -->
        <div id="status" class="absolute top-4 left-4 bg-black/70 px-4 py-2 rounded-full text-xs font-semibold tracking-wider flex items-center gap-2 border border-green-500/50 text-green-400 z-10">
            <span class="w-2 h-2 rounded-full bg-green-400 animate-ping"></span>
            Canlı AI Aktif
        </div>

        <!-- Kamera Değiştirme Butonu -->
        <button id="switchCamBtn" class="hidden absolute bottom-4 right-4 bg-blue-600 hover:bg-blue-500 active:scale-95 text-white font-medium text-xs px-4 py-2.5 rounded-xl shadow-lg border border-blue-400/30 tracking-wide transition-all z-10 items-center gap-1.5 cursor-pointer">
            🔄 Kamera Değiştir
        </button>
    </div>

    <!-- 2. ANA YAPAY ZEKA VE KAMERA MOTORU SCRIPT BLOKU -->
    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('overlay');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const statusDiv = document.getElementById('status');
        const switchCamBtn = document.getElementById('switchCamBtn');
        
        let session = null;
        let currentStream = null;
        let currentFacingMode = 'user'; // Varsayılan ön kamera
        
        const modelInputWidth = 640;
        const modelInputHeight = 640;

        // Modelinizdeki gerçek kart isimleri dizisi
        const classNames = ["Maca_As", "Karo_Papaz", "Kupa_Kiz", "Sinek_Vale"]; 

        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = modelInputWidth;
        tempCanvas.height = modelInputHeight;
        const tempCtx = tempCanvas.getContext('2d', { willReadFrequently: true });

        let lastSmoothBox = null;
        const smoothingFactor = 0.75; 

        // Kamera Kurulumu
        async function setupCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const constraintsOptions = [
                { video: { facingMode: { ideal: currentFacingMode }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
                { video: { facingMode: currentFacingMode }, audio: false },
                { video: true, audio: false }
            ];

            let stream = null;
            let lastError = null;

            for (const constraints of constraintsOptions) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                    if (stream) break; 
                } catch (err) {
                    lastError = err;
                }
            }

            if (!stream) {
                statusDiv.innerText = "Kamera Hatası!";
                throw lastError;
            }

            currentStream = stream;
            video.srcObject = stream;

            return new Promise((resolve) => {
                video.onloadedmetadata = async () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;

                    if (currentFacingMode === 'environment') {
                        try {
                            const videoTrack = stream.getVideoTracks();
                            const capabilities = videoTrack.getCapabilities();
                            if (capabilities.zoom) {
                                await videoTrack.applyConstraints({
                                    advanced: [{ zoom: Math.min(1.5, capabilities.zoom.max) }]
                                });
                            }
                        } catch (zoomErr) {
                            console.warn("Zoom hatası:", zoomErr);
                        }
                    }

                    try {
                        const devices = await navigator.mediaDevices.enumerateDevices();
                        const videoDevices = devices.filter(device => device.kind === 'videoinput');
                        if (videoDevices.length > 1) {
                            switchCamBtn.style.display = 'flex';
                        }
                    } catch (e) {
                        console.warn(e);
                    }

                    resolve();
                };
            });
        }

        switchCamBtn.addEventListener('click', async () => {
            currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
            statusDiv.innerHTML = 'Kamera Değiştiriliyor...';
            try {
                await setupCamera();
                statusDiv.innerHTML = 'Canlı AI Aktif';
            } catch (err) {
                console.error(err);
            }
        });

        // Hatalardan Arındırılmış Standart Model Yükleyici
        async function loadModel() {
            try {
                // Tarayıcı kısıtlamalarına takılmayan en güvenli standart yükleme modu
                session = await ort.InferenceSession.create('./model.onnx', { 
                    executionProviders: ['wasm']
                });
                statusDiv.innerHTML = '<span class="w-2 h-2 rounded-full bg-green-500"></span> Canlı AI Aktif';
            } catch (err) {
                console.error(err);
                statusDiv.innerText = "Model Yüklenemedi!";
            }
        }

            // Letterbox Önişleme
        function preprocess(videoFrame, targetWidth, targetHeight) {
            tempCtx.fillStyle = "black";
            tempCtx.fillRect(0, 0, targetWidth, targetHeight);

            const srcWidth = videoFrame.videoWidth;
            const srcHeight = videoFrame.videoHeight;
            const scale = Math.min(targetWidth / srcWidth, targetHeight / srcHeight);
            
            const nw = srcWidth * scale;
            const nh = srcHeight * scale;
            const dx = (targetWidth - nw) / 2;
            const dy = (targetHeight - nh) / 2;

            tempCtx.drawImage(videoFrame, 0, 0, srcWidth, srcHeight, dx, dy, nw, nh);
            
            const imgData = tempCtx.getImageData(0, 0, targetWidth, targetHeight);
            const { data } = imgData;

            const rChannel = new Float32Array(targetWidth * targetHeight);
            const gChannel = new Float32Array(targetWidth * targetHeight);
            const bChannel = new Float32Array(targetWidth * targetHeight);

            for (let i = 0; i < data.length; i += 4) {
                const pixelIndex = i / 4;
                rChannel[pixelIndex] = data[i] / 255.0;
                gChannel[pixelIndex] = data[i + 1] / 255.0;
                bChannel[pixelIndex] = data[i + 2] / 255.0;
            }

            const floatData = new Float32Array(3 * targetWidth * targetHeight);
            floatData.set(rChannel, 0);
            floatData.set(gChannel, targetWidth * targetHeight);
            floatData.set(bChannel, 2 * targetWidth * targetHeight);

            return new ort.Tensor('float32', floatData, [1, 3, targetWidth, targetHeight]);
        }

        // Sabit Etiketli ve Skor Yüzdeli Canlı ROI Çizici
        function drawBoundingBox(targetBox) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (!targetBox) {
                lastSmoothBox = null; 
                return;
            }

            if (lastSmoothBox) {
                lastSmoothBox.x = lastSmoothBox.x + (targetBox.x - lastSmoothBox.x) * smoothingFactor;
                lastSmoothBox.y = lastSmoothBox.y + (targetBox.y - lastSmoothBox.y) * smoothingFactor;
                lastSmoothBox.w = lastSmoothBox.w + (targetBox.w - lastSmoothBox.w) * smoothingFactor;
                lastSmoothBox.h = lastSmoothBox.h + (targetBox.h - lastSmoothBox.h) * smoothingFactor;
                lastSmoothBox.label = targetBox.label;
                lastSmoothBox.score = targetBox.score;
            } else {
                lastSmoothBox = { ...targetBox };
            }

            // Parlak Yeşil ROI Çerçevesi
            ctx.strokeStyle = '#00FF00';
            ctx.lineWidth = 4;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00FF00';

            ctx.beginPath();
            ctx.rect(lastSmoothBox.x, lastSmoothBox.y, lastSmoothBox.w, lastSmoothBox.h);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Okunabilir Sabit Bilgi Etiketi (Yüzde Oranı Dahil)
            const text = `${lastSmoothBox.label} (%${Math.round(lastSmoothBox.score * 100)})`;
            ctx.font = 'bold 15px sans-serif';
            const textWidth = ctx.measureText(text).width;
            
            ctx.fillStyle = 'rgba(0, 255, 0, 0.9)'; 
            ctx.fillRect(lastSmoothBox.x - 2, lastSmoothBox.y - 26, textWidth + 12, 24);

            ctx.fillStyle = '#000000'; 
            ctx.fillText(text, lastSmoothBox.x + 4, lastSmoothBox.y - 9);
        }

        // Kararlı Çoklu Sınıf Çözümleyici Motoru
        function parseYOLOv8Output(outputTensor, canvasWidth, canvasHeight) {
            const data = outputTensor.data;
            const dims = outputTensor.dims;
            
            const numAttributes = dims; 
            const numBoxes = dims; 

            let highestScore = 0;
            let bestBox = null;
            const scoreThreshold = 0.38; 

            const scale = Math.min(modelInputWidth / canvasWidth, modelInputHeight / canvasHeight);
            const xOffset = (modelInputWidth - canvasWidth * scale) / 2;
            const yOffset = (modelInputHeight - canvasHeight * scale) / 2;

            for (let i = 0; i < numBoxes; i++) {
                let classScore = 0;
                let classId = -1;
                
                for (let j = 4; j < numAttributes; j++) {
                    const score = data[j * numBoxes + i];
                    if (score > classScore) {
                        classScore = score;
                        classId = j - 4;
                    }
                }

                if (classScore > scoreThreshold && classScore > highestScore) {
                    highestScore = classScore;

                    let cx = data[0 * numBoxes + i];
                    let cy = data[1 * numBoxes + i];
                    let w  = data[2 * numBoxes + i];
                    let h  = data[3 * numBoxes + i];

                    const actualX = ((cx - (w / 2)) - xOffset) / scale;
                    const actualY = ((cy - (h / 2)) - yOffset) / scale;
                    const actualW = w / scale;
                    const actualH = h / scale;

                    const finalLabel = (classNames && classNames[classId]) ? classNames[classId] : `Sınıf ID: ${classId}`;

                    bestBox = { x: actualX, y: actualY, w: actualW, h: actualH, label: finalLabel, score: classScore };
                }
            }
            return bestBox;
        }

        async function processVideo() {
            if (video.paused || video.ended || !session) {
                requestAnimationFrame(processVideo);
                return;
            }

            try {
                const inputTensor = preprocess(video, modelInputWidth, modelInputHeight);
                const inputName = session.inputNames;
                const feeds = {};
                feeds[inputName] = inputTensor;

                const outputs = await session.run(feeds);
                const outputName = session.outputNames;
                const outputTensor = outputs[outputName];

                const bestBox = parseYOLOv8Output(outputTensor, canvas.width, canvas.height);
                drawBoundingBox(bestBox);

            } catch (err) {
                // Hataları sessizce geç
            }

            requestAnimationFrame(processVideo);
        }

        async function main() {
            try {
                await setupCamera();
                await loadModel();
                processVideo();
            } catch (e) {
                console.error("Sistem hatası:", e);
            }
        }

        window.addEventListener('DOMContentLoaded', main);
    </script>
</body>
</html>
