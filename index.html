<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bric Barkod - Versiyon 53.0 (Camera Switch)</title>
    <script>
        var onnx_part1 = "" + "cdn.js" + "delivr.net/npm/";
        var onnx_part2 = "onnxru" + "ntime-web@1.17.1/dist/ort.m" + "in.js";
        document.write('<script src="https://' + onnx_part1 + onnx_part2 + '"><\/script>');
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { 
            width: 100%; height: 100%; overflow: hidden; background: #0b0b0b; 
            font-family: sans-serif; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; 
        }
        #app-wrapper {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100%; height: 100%; position: relative; transition: all 0.3s ease;
        }
        #camera-frame {
            position: relative; 
            width: min(85vw, 450px); 
            height: min(85vw, 450px);
            border-radius: 20px; 
            overflow: hidden; 
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.2);
            border: 2px solid #333;
            background: #000;
            transition: width 0.3s ease, height 0.3s ease, border-radius 0.3s ease;
        }
        #app-wrapper.fullscreen-mode #camera-frame {
            width: 100% !important;
            height: 100% !important;
            border-radius: 0 !important;
            border: none !important;
            box-shadow: none !important;
        }
        video { 
            width: 100%; height: 100%; object-fit: cover; 
            position: absolute; top: 0; left: 0; 
        } 
        /* Varsayılan olarak ön kamerada ayna efekti aktif */
        video.mirror-mode { transform: scaleX(-1); }
        canvas { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 10; pointer-events: none; 
        }
        canvas.mirror-mode { transform: scaleX(-1); }
        #debug-panel {
            position: absolute; top: 15px; left: 15px; right: 15px;
            background: rgba(0, 0, 0, 0.8); color: #00ff00; padding: 10px;
            border-radius: 8px; font-family: monospace; font-size: 11px; z-index: 20;
            border: 1px solid #00ff00; pointer-events: none;
        }
        .btn-group {
            display: flex; gap: 10px; margin-top: 15px; z-index: 30;
        }
        .ctrl-btn {
            background: #111; color: #00ff00; border: 1px solid #00ff00;
            padding: 10px 18px; font-weight: bold; font-size: 13px;
            border-radius: 25px; cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
            transition: background 0.2s, color 0.2s;
        }
        .ctrl-btn:hover { background: #00ff00; color: #000; }
        #result-badge {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            background: #00ff00; color: #000; padding: 12px 24px; font-weight: bold;
            font-size: 16px; border-radius: 50px; z-index: 40; display: none;
            box-shadow: 0 0 20px #00ff00; text-align: center; white-space: nowrap;
        }
    </style>
</head>
<body>
<div id="app-wrapper">
    <div id="camera-frame">
        <video id="webcam" class="mirror-mode" autoplay playsinline muted></video>
        <canvas id="overlay" class="mirror-mode"></canvas>
        <div id="debug-panel">
            <div>[BRIC BARKOD V53.0 - CAM SWITCH]</div>
            <div id="fps">AI FPS: --</div>
            <div id="status">Sistem başlatılıyor...</div>
        </div>
    </div>
    <div class="btn-group">
        <button class="ctrl-btn" id="toggle-btn" onclick="toggleViewMode()">Tam Ekrana Geç</button>
        <button class="ctrl-btn" onclick="switchCamera()">Kamera Değiştir</button>
    </div>
</div>
<div id="result-badge">---</div>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const fpsDiv = document.getElementById('fps');
    const resultBadge = document.getElementById('result-badge');
    const appWrapper = document.getElementById('app-wrapper');
    const toggleBtn = document.getElementById('toggle-btn');
    let onnxSession = null;
    let aiFpsCount = 0;
    let lastFpsUpdate = Date.now();
    let isFullscreen = false;
    let useFrontCamera = true;
    let currentStream = null;
    const DISPLAY_LABEL = 'Kupa 8';
    const CONFIDENCE_THRESHOLD = 0.15; 

    const targetSize = 640 * 640;
    let offscreenCanvas;
    if (typeof OffscreenCanvas !== 'undefined') {
        offscreenCanvas = new OffscreenCanvas(640, 640);
    } else {
        offscreenCanvas = document.createElement('canvas');
        offscreenCanvas.width = 640;
        offscreenCanvas.height = 640;
    }
    const offscreenCtx = offscreenCanvas.getContext('2d', { willReadFrequently: true });

    const globalR = new Float32Array(targetSize);
    const globalG = new Float32Array(targetSize);
    const globalB = new Float32Array(targetSize);
    const globalInterleaved = new Float32Array(1 * 3 * targetSize);

    let isProcessing = false;
    let scoreHistory = [];
    const MAX_HISTORY = 5;

    function toggleViewMode() {
        isFullscreen = !isFullscreen;
        if (isFullscreen) {
            appWrapper.classList.add('fullscreen-mode');
            toggleBtn.innerText = '1:1 Kare Mode Dön';
        } else {
            appWrapper.classList.remove('fullscreen-mode');
            toggleBtn.innerText = 'Tam Ekrana Geç';
        }
        setTimeout(() => {
            canvas.width = video.videoWidth || window.innerWidth;
            canvas.height = video.videoHeight || window.innerHeight;
        }, 50);
    }

    async function setupWebcam() {
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
        }
        const constraints = {
            video: { 
                facingMode: useFrontCamera ? "user" : "environment", 
                width: { ideal: 1280 }, 
                height: { ideal: 720 }, 
                frameRate: { ideal: 60 } 
            },
            audio: false
        };
        try {
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            currentStream = stream;
            video.srcObject = stream;
            
            if (useFrontCamera) {
                video.classList.add('mirror-mode');
                canvas.classList.add('mirror-mode');
            } else {
                video.classList.remove('mirror-mode');
                canvas.classList.remove('mirror-mode');
            }

            return new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    resolve();
                };
            });
        } catch (err) {
            statusDiv.innerText = "Kamera Hatası: " + err.message;
        }
    }

    async function switchCamera() {
        useFrontCamera = !useFrontCamera;
        statusDiv.innerText = useFrontCamera ? "Ön kameraya geçiliyor..." : "Arka kameraya geçiliyor...";
        await setupWebcam();
    }

    async function loadModel() {
        try {
            statusDiv.innerText = "YOLOv8 ONNX yükleniyor...";
            onnxSession = await ort.InferenceSession.create('./best.onnx', { executionProviders: ['wasm'] });
            statusDiv.innerText = "V52.6 Boyut Dizisi Sabitlendi...";
            statusDiv.style.color = "#00ff00";
            detectFrame();
        } catch (err) {
            statusDiv.innerText = "Model Hatası: " + err.message;
            statusDiv.style.color = "#ff0000";
        }
    }

    function createFreshTensor(videoElement) {
        offscreenCtx.drawImage(videoElement, 0, 0, 640, 640);
        const imgData = offscreenCtx.getImageData(0, 0, 640, 640);
        const { data } = imgData;

        for (let i = 0, idx = 0; i < data.length; i += 4, idx++) {
            globalR[idx] = data[i] / 255.0;
            globalG[idx] = data[i+1] / 255.0;
            globalB[idx] = data[i+2] / 255.0;
        }

        globalInterleaved.set(globalR, 0);
        globalInterleaved.set(globalG, targetSize);
        globalInterleaved.set(globalB, 2 * targetSize);

        // KESİN DÜZELTME: Boyut dizisi eklendi
        return new ort.Tensor('float32', globalInterleaved,);
    }

    async function detectFrame() {
        if (isProcessing) {
            requestAnimationFrame(detectFrame);
            return;
        }

        isProcessing = true;

        const now = Date.now();
        if (now - lastFpsUpdate >= 1000) {
            fpsDiv.innerText = `AI FPS: ${aiFpsCount} | V52.6`;
            aiFpsCount = 0;
            lastFpsUpdate = now;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (onnxSession && video.readyState === video.HAVE_ENOUGH_DATA) {
            let inputTensor = null;
            try {
                inputTensor = createFreshTensor(video);
                const outputMap = await onnxSession.run({ [onnxSession.inputNames]: inputTensor });
                const outputTensor = outputMap[onnxSession.outputNames];
                const rawData = outputTensor.data;
                
                aiFpsCount++;
                let bestScore = 0;
                const numBoxes = outputTensor.dims; 
                
                for (let i = 0; i < numBoxes; i++) {
                    let score = rawData[4 * numBoxes + i]; 
                    if (score > CONFIDENCE_THRESHOLD && score > bestScore) {
                        bestScore = score;
                    }
                }
                
                if (outputTensor && typeof outputTensor.dispose === 'function') {
                    outputTensor.dispose();
                }

                if (bestScore > CONFIDENCE_THRESHOLD) {
                    scoreHistory.push(Math.round(bestScore * 100));
                    if (scoreHistory.length > MAX_HISTORY) {
                        scoreHistory.shift();
                    }
                    resultBadge.innerText = `${DISPLAY_LABEL} | %` + scoreHistory.join(' -> %');
                    resultBadge.style.display = "block";
                } else {
                    scoreHistory = [];
                    resultBadge.style.display = "none";
                }
            } catch (inferError) {
                console.error("Çıkarım Hatası:", inferError);
            } finally {
                if (inputTensor && typeof inputTensor.dispose === 'function') {
                    inputTensor.dispose();
                }
            }
        }

        isProcessing = false;
        requestAnimationFrame(detectFrame);
    }
    
    window.onload = async () => {
        await setupWebcam();
        await loadModel();
    };
</script>
</body>
</html>
