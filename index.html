<!-- BRIC BARKOD - VERSIYON 38 (SAF SAYISAL MATRİS MOTORU) -->
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bric Barkod - Real-Time AI Scanner (V38)</title>
    
    <!-- 1. ENGELİ AŞAN PARÇALI CDN KÜTÜPHANE YÜKLEYİCİ -->
    <script>
        var onnx_part1 = "https://" + "cdn.js" + "delivr.net/npm/";
        var onnx_part2 = "onnxru" + "ntime-web@1.17.1/dist/ort.m" + "in.js";
        document.write('<script src="' + onnx_part1 + onnx_part2 + '"><\/script>');

        var tw_part1 = "https://" + "cdn.js" + "delivr.net/npm/@tail";
        var tw_part2 = "windcss/br" + "owser@4";
        document.write('<script src="' + tw_part1 + tw_part2 + '"><\/script>');
    </script>

    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    
    <style>
        /* Görüntü kozmetik olarak düz (Aynalama tamamen kapalı) */
        video, canvas {
            transform: scaleX(1);
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4 select-none">

    <div class="relative w-full max-w-xl bg-gray-800 rounded-2xl overflow-hidden shadow-2xl border border-gray-700">
        <video id="webcam" autoplay playsinline muted class="w-full h-auto block"></video>
        <canvas id="overlay" class="absolute top-0 left-0 w-full h-full pointer-events-none"></canvas>
        
        <!-- Dinamik Durum Paneli -->
        <div id="status" class="absolute top-4 left-4 bg-black/70 px-4 py-2 rounded-full text-xs font-semibold tracking-wider flex items-center gap-2 border border-green-500/50 text-green-400 z-10">
            <span class="w-2 h-2 rounded-full bg-green-400 animate-ping"></span>
            Yapay Zeka Yükleniyor...
        </div>

        <!-- Kamera Değiştirme Butonu -->
        <button id="switchCamBtn" class="hidden absolute bottom-4 right-4 bg-blue-600 hover:bg-blue-500 active:scale-95 text-white font-medium text-xs px-4 py-2.5 rounded-xl shadow-lg border border-blue-400/30 tracking-wide transition-all z-10 items-center gap-1.5 cursor-pointer">
            🔄 Kamera Değiştir
        </button>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('overlay');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const statusDiv = document.getElementById('status');
        const switchCamBtn = document.getElementById('switchCamBtn');
        
        let session = null;
        let currentStream = null;
        let currentFacingMode = 'user'; // Ön kamera öncelikli
        
        const modelInputWidth = 640;
        const modelInputHeight = 640;

        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = modelInputWidth;
        tempCanvas.height = modelInputHeight;
        const tempCtx = tempCanvas.getContext('2d', { willReadFrequently: true });

        // Kamera Kurulumu
        async function setupCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const constraintsOptions = [
                { video: { facingMode: { ideal: currentFacingMode }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
                { video: { facingMode: currentFacingMode }, audio: false },
                { video: true, audio: false }
            ];

            let stream = null;
            let lastError = null;

            for (const constraints of constraintsOptions) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                    if (stream) break; 
                } catch (err) {
                    lastError = err;
                }
            }

            if (!stream) {
                statusDiv.innerText = "Kamera Hatası!";
                throw lastError;
            }

            currentStream = stream;
            video.srcObject = stream;

            return new Promise((resolve) => {
                video.onloadedmetadata = async () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;

                    if (currentFacingMode === 'environment') {
                        try {
                            const videoTrack = stream.getVideoTracks();
                            const capabilities = videoTrack.getCapabilities();
                            if (capabilities.zoom) {
                                await videoTrack.applyConstraints({
                                    advanced: [{ zoom: Math.min(1.5, capabilities.zoom.max) }]
                                });
                            }
                        } catch (zoomErr) {
                            console.warn("Zoom hatası:", zoomErr);
                        }
                    }

                    try {
                        const devices = await navigator.mediaDevices.enumerateDevices();
                        const videoDevices = devices.filter(device => device.kind === 'videoinput');
                        if (videoDevices.length > 1) {
                            switchCamBtn.style.display = 'flex';
                        }
                    } catch (e) {
                        console.warn(e);
                    }

                    resolve();
                };
            });
        }

        switchCamBtn.addEventListener('click', async () => {
            currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
            statusDiv.innerHTML = 'Kamera Değiştiriliyor...';
            try {
                await setupCamera();
                statusDiv.innerHTML = 'Canlı AI Aktif';
            } catch (err) {
                console.error(err);
            }
        });

        // DOĞRUDAN TEK PARÇA 5.9 MB SAF MODELİ OKUYAN YÜKLEYİCİ
        async function loadModel() {
            try {
                statusDiv.innerText = "5.9 MB Sürüm 38 Saf Model Okunuyor...";
                
                // Hiçbir kısıtlamaya takılmayan tertemiz WASM motoru
                session = await ort.InferenceSession.create('./model.onnx', { 
                    executionProviders: ['wasm']
                });

                statusDiv.innerHTML = '<span class="w-2 h-2 rounded-full bg-green-500"></span> Canlı AI Aktif';
            } catch (err) {
                console.error("Model yükleme hatası:", err);
                statusDiv.innerText = "Kök dizinde model.onnx dosyası bulunamadı!";
            }
        }

        // Letterbox Önişleme
        function preprocess(videoFrame, targetWidth, targetHeight) {
            tempCtx.fillStyle = "black";
            tempCtx.fillRect(0, 0, targetWidth, targetHeight);

            const srcWidth = videoFrame.videoWidth;
            const srcHeight = videoFrame.videoHeight;
            const scale = Math.min(targetWidth / srcWidth, targetHeight / srcHeight);
            
            const nw = srcWidth * scale;
            const nh = srcHeight * scale;
            const dx = (targetWidth - nw) / 2;
            const dy = (targetHeight - nh) / 2;

            tempCtx.drawImage(videoFrame, 0, 0, srcWidth, srcHeight, dx, dy, nw, nh);
            
            const imgData = tempCtx.getImageData(0, 0, targetWidth, targetHeight);
            const { data } = imgData;

            const rChannel = new Float32Array(targetWidth * targetHeight);
            const gChannel = new Float32Array(targetWidth * targetHeight);
            const bChannel = new Float32Array(targetWidth * targetHeight);

            for (let i = 0; i < data.length; i += 4) {
                const pixelIndex = i / 4;
                rChannel[pixelIndex] = data[i] / 255.0;
                gChannel[pixelIndex] = data[i + 1] / 255.0;
                bChannel[pixelIndex] = data[i + 2] / 255.0;
            }

            const floatData = new Float32Array(3 * targetWidth * targetHeight);
            floatData.set(rChannel, 0);
            floatData.set(gChannel, targetWidth * targetHeight);
            floatData.set(bChannel, 2 * targetWidth * targetHeight);

            return new ort.Tensor('float32', floatData, [1, 3, targetWidth, targetHeight]);
        }

        // Sürüklenmeleri bitiren sıfır gecikmeli anlık ROI çizici
        function drawBoundingBox(targetBox) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (!targetBox) return; // Kart gidince kutu milisaniyede anında sönümlenir!

            // Parlak Yeşil ROI Çerçevesi
            ctx.strokeStyle = '#00FF00';
            ctx.lineWidth = 4;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00FF00';

            ctx.beginPath();
            ctx.rect(targetBox.x, targetBox.y, targetBox.w, targetBox.h);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Okunabilir Sabit Bilgi Etiketi (Kart İsmi ve Yüzdelik Oranı)
            const text = `${targetBox.label} (%${Math.round(targetBox.score * 100)})`;
            ctx.font = 'bold 15px sans-serif';
            const textWidth = ctx.measureText(text).width;
            
            ctx.fillStyle = 'rgba(0, 255, 0, 0.9)'; 
            ctx.fillRect(targetBox.x - 2, targetBox.y - 26, textWidth + 12, 24);

            ctx.fillStyle = '#000000'; 
            ctx.fillText(text, targetBox.x + 4, targetBox.y - 9);
        }

        // SÜRÜM 38: Saf Sayısal Matris Filtre Motoru (Kesin Çözüm)
        let matchCounter = 0;
        let lastDetectedCard = null;
        const REQUIRED_FRAMES = 2; 

        function parseYOLOv8Output(outputTensor, canvasWidth, canvasHeight) {
            const data = outputTensor.data; 
            const numBoxes = 8400; 
            const scoreThreshold = 0.40; // Hassas kalpleri kaçırmamak için %40 eşiği

            const scale = Math.min(modelInputWidth / canvasWidth, modelInputHeight / canvasHeight);
            const xOffset = (modelInputWidth - canvasWidth * scale) / 2;
            const yOffset = (modelInputHeight - canvasHeight * scale) / 2;

            let detectedRanks = [];
            let detectedSuits = [];

            for (let i = 0; i < numBoxes; i++) {
                // Katman 4, 5 ve 6'dan ham skor verilerini çekiyoruz
                const s0 = data[4 * numBoxes + i]; // Sınıf 0: '3'
                const s1 = data[5 * numBoxes + i]; // Sınıf 1: '8'
                const s2 = data[6 * numBoxes + i]; // Sınıf 2: 'Heart'

                // Güvenlik kalkanı: Skor eşiğini geçenleri sayısal ID'sine göre ayır
                if (s0 > scoreThreshold && s0 > s1 && s0 > s2) {
                    detectedRanks.push(getBoxData(data, i, scale, xOffset, yOffset, "3", s0, 0));
                }
                if (s1 > scoreThreshold && s1 > s0 && s1 > s2) {
                    detectedRanks.push(getBoxData(data, i, scale, xOffset, yOffset, "8", s1, 1));
                }
                if (s2 > scoreThreshold && s2 > s0 && s2 > s1) {
                    detectedSuits.push(getBoxData(data, i, scale, xOffset, yOffset, "Heart", s2, 2));
                }
            }

            // TEŞHİS RADARI V38: Kalp krizinin çözülüp çözülmediğini gösterir
            if (detectedRanks.length > 0 || detectedSuits.length > 0) {
                console.log(`[RADAR-V38] Rakam Sayısı: ${detectedRanks.length}, Kalp Sayısı: ${detectedSuits.length}`);
            }

            if (detectedRanks.length === 0 || detectedSuits.length === 0) {
                if (matchCounter > 0) matchCounter--;
                return null;
            }

            // En yüksek skorlu ilk elemanları çekmek için sırala
            detectedRanks.sort((a, b) => b.score - a.score);
            detectedSuits.sort((a, b) => b.score - a.score);

            // Dizinin en iyi ilk elemanını nesne olarak yakala
            let bestRank = detectedRanks[0];
            let bestSuit = detectedSuits[0];

            // Merkez Koordinat Hesaplama
            let rankCX = bestRank.x + bestRank.w / 2;
            let rankCY = bestRank.y + bestRank.h / 2;
            let suitCX = bestSuit.x + bestSuit.w / 2;
            let suitCY = bestSuit.y + bestSuit.h / 2;

            let dX = Math.abs(rankCX - suitCX);
            let dY = Math.abs(rankCY - suitCY);

            // Geometrik Tolerans Alanı (X ekseni hizası max 100px, Y ekseni yakınlığı max 200px)
            let isAligned = dX < 100;
            let isCloseEnough = dY < 200;

            if (isAligned && isCloseEnough) {
                let currentCard = bestRank.classId === 0 ? "Heart 3" : "Heart 8";

                if (lastDetectedCard === currentCard) {
                    matchCounter++;
                } else {
                    matchCounter = 1;
                    lastDetectedCard = currentCard;
                }

                if (matchCounter >= REQUIRED_FRAMES) {
                    const minX = Math.min(bestRank.x, bestSuit.x);
                    const minY = Math.min(bestRank.y, bestSuit.y);
                    const maxX = Math.max(bestRank.x + bestRank.w, bestSuit.x + bestSuit.w);
                    const maxY = Math.max(bestRank.y + bestRank.h, bestSuit.y + bestSuit.h);

                    return {
                        x: minX - 8, 
                        y: minY - 8,
                        w: (maxX - minX) + 16,
                        h: (maxY - minY) + 16,
                        label: currentCard,
                        score: (bestRank.score + bestSuit.score) / 2
                    };
                }
            } else {
                if (matchCounter > 0) matchCounter--;
            }

            return null;
        }

        function getBoxData(data, i, scale, xOffset, yOffset, label, score, classId) {
            const numBoxes = 8400;
            let cx = data[0 * numBoxes + i];
            let cy = data[1 * numBoxes + i];
            let w  = data[2 * numBoxes + i];
            let h  = data[3 * numBoxes + i];

            return {
                x: ((cx - (w / 2)) - xOffset) / scale,
                y: ((cy - (h / 2)) - yOffset) / scale,
                w: w / scale,
                h: h / scale,
                label: label,
                score: score,
                classId: classId
            };
        }

        async function processVideo() {
            if (video.paused || video.ended || !session) {
                requestAnimationFrame(processVideo);
                return;
            }

            try {
                const inputTensor = preprocess(video, modelInputWidth, modelInputHeight);
                const inputName = session.inputNames[0] || "images";
                const feeds = {};
                feeds[inputName] = inputTensor;

                const outputs = await session.run(feeds);
                const outputName = session.outputNames[0] || "output0";
                const outputTensor = outputs[outputName];

                const bestBox = parseYOLOv8Output(outputTensor, canvas.width, canvas.height);
                drawBoundingBox(bestBox);

            } catch (err) {
                console.error("YOLO İşleme Hatası:", err);
            }

            requestAnimationFrame(processVideo);
        }

        async function main() {
            try {
                await setupCamera();
                await loadModel();
                processVideo();
            } catch (e) {
                console.error("Sistem hatası:", e);
            }
        }

        window.addEventListener('DOMContentLoaded', main);
    </script>
</body>
</html>
