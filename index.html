<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hearts Ten Dedektörü (Ön Kamera)</title>

<!-- 1. Kendi bulduğunuz %100 doğru jsDelivr CDN linki -->
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.0/dist/ort.min.js"></script>

<!-- 2. Tarayıcının arka plandaki WebAssembly (.wasm) motorunu jsDelivr üzerinden bulmasını sağlayan kod -->
<script>
    if (typeof ort !== 'undefined') {
        // En sondaki eğik çizgiye ( / ) dikkat edin, dosyaların birbirine yapışmasını engeller
        ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.0/dist/";
    }
</script>


    <style>
        body { text-align: center; font-family: Arial, sans-serif; background: #111; color: white; margin: 0; padding: 20px; }
        h1 { font-size: 1.5rem; margin-bottom: 5px; }
        #status { margin: 15px; font-size: 1.1rem; color: #00ffcc; font-weight: bold; }
        #videoContainer { position: relative; width: 640px; height: 640px; margin: 0 auto; background: #000; border: 2px solid #333; }
        
        /* Ön kamerada ayna efekti için scaleX(-1) uygulandı */
        video, canvas { 
            position: absolute; 
            left: 0; 
            top: 0; 
            transform: scaleX(-1); 
            width: 100%; 
            height: 100%; 
        }
    </style>
</head>
<body>

    <h1>RT-DETR Hearts Ten Detection</h1>
    <div id="status">Model yükleniyor, lütfen bekleyin...</div>

    <div id="videoContainer">
        <video id="webcam" autoplay playsinline style="opacity: 0;"></video>
        <canvas id="outputCanvas" width="640" height="640"></canvas>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('outputCanvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');
        let session;

        // 1. Ön Kamerayı ve ONNX Modelini Başlat
        async function init() {
            try {
                // facingMode: "user" ile ön (selfie) kamerasını açıyoruz
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 640 } }
                });
                video.srcObject = stream;

                status.innerText = "Model dosyası indiriliyor (Lütfen bekleyin)...";
                
                // WebGL veya WASM optimizasyonu ile modeli yüklüyoruz
                session = await ort.InferenceSession.create('./model.onnx', { executionProviders: ['webgl', 'wasm'] });
                
                status.innerText = "Sistem Hazır! Kupa Onlusunu Ön Kameraya Gösterin.";
                
                video.addEventListener('loadeddata', processVideo);
            } catch (e) {
                status.innerText = "Hata oluştu: " + e.message;
                console.error(e);
            }
        }

        // 2. Canlı Kamera Görüntüsünü İşleme Döngüsü
        async function processVideo() {
            ctx.drawImage(video, 0, 0, 640, 640);
            
            const imgData = ctx.getImageData(0, 0, 640, 640);
            const inputTensor = imageToInputTensor(imgData);

            try {
                // Yapay zeka tahminini çalıştır
                const feeds = {};
                feeds[session.inputNames] = inputTensor;
                const outputMap = await session.run(feeds);
                
                // Model çıktı verisini al
                const output = outputMap[session.outputNames].data;
                
                // Ekrana Kupa Onlusu kutusunu çiz
                parseOutputs(output);
            } catch (error) {
                console.error("Tahmin hatası:", error);
            }

            // Sürekli döngü için sonraki kareyi tetikle
            requestAnimationFrame(processVideo);
        }

        // Görüntüyü Modelin Beklediği Matematiksel Tensör Formatına Çevirme [0-255] -> [0-1]
        function imageToInputTensor(imgData) {
            const floatData = new Float32Array(3 * 640 * 640);
            let rIndex = 0, gIndex = 640 * 640, bIndex = 2 * 640 * 640;
            
            for (let i = 0; i < imgData.data.length; i += 4) {
                floatData[rIndex++] = imgData.data[i] / 255.0;     // R
                floatData[gIndex++] = imgData.data[i + 1] / 255.0; // G
                floatData[bIndex++] = imgData.data[i + 2] / 255.0; // B
            }
            return new ort.Tensor('float32', floatData, [1, 3, 640, 640]);
        }

        // Model Çıktısını Ekranda Görselleştirme
        function parseOutputs(output) {
            // RT-DETR çıktısını tarar. Güven skoru %50'den yüksekse kutu çizer
            for (let i = 0; i < output.length; i += 6) {
                let confidence = output[i + 4];
                if (confidence > 0.5) {
                    let x = output[i] * canvas.width;
                    let y = output[i + 1] * canvas.height;
                    let w = (output[i + 2] * canvas.width) - x;
                    let h = (output[i + 3] * canvas.height) - y;

                    // Tespit kutusu tasarımı
                    ctx.strokeStyle = "#00ffcc";
                    ctx.lineWidth = 4;
                    ctx.strokeRect(x, y, w, h);

                    // Etiket tasarımı (Ayna efekti CSS ile yapıldığından yazılar düzgün okunur)
                    ctx.fillStyle = "#00ffcc";
                    ctx.font = "bold 18px Arial";
                    ctx.fillText("Hearts Ten: " + Math.round(confidence * 100) + "%", x, y - 10);
                }
            }
        }

        window.onload = init;
    </script>
</body>
</html>
