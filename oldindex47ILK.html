<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bric Barkod - Versiyon 47</title>

    <!-- 1. ENGELİ AŞAN PARÇALI CDN KÜTÜPHANE YÜKLEYİCİ -->
    <script>
        // TensorFlow.js Parçalı Yükleyici
        var tf_part1 = "ht" + "tps:/" + "/cdn.js" + "delivr.net/npm/@ten";
        var tf_part2 = "sorflow/t" + "fjs@4.10.0/dist/tf.m" + "in.js";
        document.write('<script src="' + tf_part1 + tf_part2 + '"><\/script>');

        // COCO-SSD Model Kütüphanesi Parçalı Yükleyici
        var coco_part1 = "ht" + "tps:/" + "/cdn.js" + "delivr.net/npm/@ten";
        var coco_part2 = "sorflow-models/co" + "co-ssd@2.2.3/dist/co" + "co-ssd.min.js";
        document.write('<script src="' + coco_part1 + coco_part2 + '"><\/script>');
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #container { position: relative; width: 100%; height: 100%; }
        video { width: 100%; height: 100%; object-fit: cover; position: absolute; transform: scaleX(-1); } 
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        #debug-panel {
            position: absolute; top: 15px; left: 15px; right: 15px;
            background: rgba(0, 0, 0, 0.75); color: #00ff00; padding: 12px;
            border-radius: 8px; font-family: monospace; font-size: 13px; z-index: 20;
            border: 1px solid #00ff00; pointer-events: none;
        }
        #result-badge {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #00ff00; color: #000; padding: 15px 30px; font-weight: bold;
            font-size: 24px; border-radius: 50px; z-index: 20; display: none;
            box-shadow: 0 0 20px #00ff00; text-transform: uppercase;
        }
    </style>
</head>
<body>

<div id="container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    
    <div id="debug-panel">
        <div>[BRIC BARKOD V47 - PARÇALI CDN]</div>
        <div id="fps">FPS: --</div>
        <div id="status">Kütüphane kontrol ediliyor...</div>
    </div>
    
    <div id="result-badge">---</div>
</div>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const fpsDiv = document.getElementById('fps');
    const resultBadge = document.getElementById('result-badge');

    let model = null;
    let lastFrameTime = Date.now();
    
    // 17 Sınıflı Tam Havuz (Tamamen Küçük Harf ve İngilizce Standartı)
    const RANKS = ['2', '3', '4', '5', '6', '7', '8', '9', '10', 'j', 'q', 'k', 'a'];
    const SUITS = ['heart', 'spade', 'diamond', 'club'];
    
    // Türkçe Gösterim Sözlüğü
    const TURKISH_LABELS = {
        'heart': 'Kupa', 'spade': 'Maça', 'diamond': 'Karo', 'club': 'Sinek',
        'j': 'Vale', 'q': 'Kız', 'k': 'Papaz', 'a': 'As'
    };
    
    // Geniş test aşaması güven oranı
    const CONFIDENCE_THRESHOLD = 0.65; 

    async function setupWebcam() {
        const constraints = {
            video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 60 } },
            audio: false
        };
        try {
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            return new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    resolve();
                };
            });
        } catch (err) {
            statusDiv.innerText = "Kamera Hatası: " + err.message;
        }
    }

    async function loadModel() {
        try {
            statusDiv.innerText = "Model yükleniyor...";
            // Parçalı yüklenen COCO-SSD nesnesi tetikleniyor
            model = await cocoSsd.load(); 
            statusDiv.innerText = "17 Sınıf Aktif. Geniş test başladı...";
            detectFrame();
        } catch (err) {
            statusDiv.innerText = "Model Yükleme Hatası: " + err.message;
        }
    }

    async function detectFrame() {
        const now = Date.now();
        const fps = Math.round(1000 / (now - lastFrameTime));
        lastFrameTime = now;
        fpsDiv.innerText = `FPS: ${fps} | Çözünürlük: ${video.videoWidth}x${video.videoHeight}`;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (model) {
            const predictions = await model.detect(video);
            
            let detectedRank = null;
            let detectedSuit = null;
            let bestBox = null;

            predictions.forEach(prediction => {
                if (prediction.score >= CONFIDENCE_THRESHOLD) {
                    const className = prediction.class.toLowerCase();

                    if (RANKS.includes(className)) {
                        detectedRank = className;
                        bestBox = prediction.bbox; 
                    }
                    if (SUITS.includes(className)) {
                        detectedSuit = className;
                        if(!bestBox) bestBox = prediction.bbox;
                    }
                }
            });

            // Kural motoru: Rank ve Suit eşleşmesi
            if (detectedRank && detectedSuit && bestBox) {
                const rankDisplay = TURKISH_LABELS[detectedRank] || detectedRank.toUpperCase();
                const suitDisplay = TURKISH_LABELS[detectedSuit];
                
                const cardName = `${suitDisplay} ${rankDisplay}`;
                
                resultBadge.innerText = cardName;
                resultBadge.style.display = "block";

                const [x, y, width, height] = bestBox;
                const correctedX = canvas.width - x - width; 

                ctx.strokeStyle = "#00ff00";
                ctx.lineWidth = 4;
                ctx.strokeRect(correctedX, y, width, height);

                ctx.fillStyle = "#00ff00";
                ctx.font = "bold 16px monospace";
                ctx.fillText(cardName, correctedX, y > 20 ? y - 10 : 20);
                
            } else {
                resultBadge.style.display = "none";
            }
        }

        requestAnimationFrame(detectFrame);
    }

    window.onload = async () => {
        await setupWebcam();
        await loadModel();
    };
</script>

</body>
</html>
