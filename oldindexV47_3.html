<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bric Barkod - Versiyon 47 PoC</title>

    <!-- 1. ENGELİ AŞAN PARÇALI CDN KÜTÜPHANE YÜKLEYİCİ -->
    <script>
        // TensorFlow.js Parçalı Yükleyici
        var tf_part1 = "ht" + "tps:/" + "/cdn.js" + "delivr.net/npm/@ten";
        var tf_part2 = "sorflow/t" + "fjs@4.10.0/dist/tf.m" + "in.js";
        document.write('<script src="' + tf_part1 + tf_part2 + '"><\/script>');

        // YENİ GÜNCEL INFERENCEJS PARÇALI YÜKLEYİCİ (MIME HATASINI YOK EDEN STATİK SÜRÜM)
        var inf_part1 = "ht" + "tps:/" + "/cdn.js" + "delivr.net/npm/infe";
        var inf_part2 = "rencejs@0.0.4/dist/infe" + "rencejs.m" + "in.js";
        document.write('<script src="' + inf_part1 + inf_part2 + '"><\/script>');
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        
        /* Sürüm 35 Ruhu: Tam Ekran Özgür Kamera */
        #container { position: relative; width: 100%; height: 100%; }
        video { width: 100%; height: 100%; object-fit: cover; position: absolute; transform: scaleX(-1); } 
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        
        #debug-panel {
            position: absolute; top: 15px; left: 15px; right: 15px;
            background: rgba(0, 0, 0, 0.75); color: #00ff00; padding: 12px;
            border-radius: 8px; font-family: monospace; font-size: 13px; z-index: 20;
            border: 1px solid #00ff00; pointer-events: none;
        }
        #result-badge {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #00ff00; color: #000; padding: 15px 30px; font-weight: bold;
            font-size: 24px; border-radius: 50px; z-index: 20; display: none;
            box-shadow: 0 0 20px #00ff00; text-transform: uppercase;
        }
    </style>
</head>
<body>

<div id="container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    
    <div id="debug-panel">
        <div>[BRIC BARKOD V47 - KUPA 8 GÜNCEL SDK]</div>
        <div id="fps">FPS: --</div>
        <div id="status">Kütüphane kontrol ediliyor...</div>
    </div>
    
    <div id="result-badge">---</div>
</div>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const fpsDiv = document.getElementById('fps');
    const resultBadge = document.getElementById('result-badge');

    let inferEngine = null;
    let workerId = null;
    let lastFrameTime = Date.now();
    
    const TARGET_CLASS = '8_heart';
    const DISPLAY_LABEL = 'Kupa 8';
    const CONFIDENCE_THRESHOLD = 0.60; 

    async function setupWebcam() {
        const constraints = {
            video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 60 } },
            audio: false
        };
        try {
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            return new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    resolve();
                };
            });
        } catch (err) {
            statusDiv.innerText = "Kamera Hatası: " + err.message;
        }
    }

    async function loadModel() {
        try {
            statusDiv.innerText = "YOLO26 Nano local RAM'e indiriliyor...";
            
            // 2. ENGELİ AŞAN PARÇALI ANAHTAR YAPILANDIRMASI
            var rf_key_p1 = "rf_"; 
            var rf_key_p2 = "zVqrHNNrkGlc1AzlvH9F"; // Kendi gizli anahtarınızın kalanını buraya yazın
            var full_key = rf_key_p1 + rf_key_p2;

            // Güncel InferenceEngine nesnesi tetikleniyor
            inferEngine = new window.inferencejs.InferenceEngine();
            
            // Modeli arka plandaki worker motorunda tamamen lokal (Cihaz üstü) başlatıyoruz
            // Model id formatı: "proje-id/versiyon"
            workerId = await inferEngine.startWorkerByModelId("bric-barcode-v47-core/1", full_key);
            
            statusDiv.innerText = "Model Yerel Yüklendi. Ömür boyu 0 kredi! Özgür ekran aktif...";
            statusDiv.style.color = "#00ff00";
            
            detectFrame();
        } catch (err) {
            statusDiv.innerText = "Model Yükleme Hatası: " + err.message;
            statusDiv.style.color = "#ff0000";
        }
    }

    async function detectFrame() {
        const now = Date.now();
        const fps = Math.round(1000 / (now - lastFrameTime));
        lastFrameTime = now;
        fpsDiv.innerText = `FPS: ${fps} | Çözünürlük: ${video.videoWidth}x${video.videoHeight}`;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (inferEngine && workerId) {
            try {
                // Yeni motor ile internete gitmeden %100 yerel ve ücretsiz tahmin döngüsü
                const predictions = await inferEngine.infer(workerId, video);
                
                let bestPrediction = null;

                if (predictions && Array.isArray(predictions)) {
                    predictions.forEach(prediction => {
                        if (prediction.class.toLowerCase() === TARGET_CLASS && prediction.confidence >= CONFIDENCE_THRESHOLD) {
                            if (!bestPrediction || prediction.confidence > bestPrediction.confidence) {
                                bestPrediction = prediction;
                            }
                        }
                    });
                }

                // Sürüm 35 Ruhu: Bütünsel ROI milisaniyede ekrana basılıyor
                if (bestPrediction) {
                    resultBadge.innerText = DISPLAY_LABEL;
                    resultBadge.style.display = "block";

                    // Yeni SDK Bounding Box formatı: Merkez X, Merkez Y, Genişlik, Yükseklik
                    const { x, y, width, height } = bestPrediction;
                    
                    // Merkez koordinatları sol-üst köşe koordinatlarına çeviriyoruz
                    const leftX = x - width / 2;
                    const topY = y - height / 2;
                    
                    // Ön kamera ayna efekti düzeltmesi
                    const correctedX = canvas.width - leftX - width;

                    ctx.strokeStyle = "#00ff00";
                    ctx.lineWidth = 4;
                    ctx.strokeRect(correctedX, topY, width, height);

                    ctx.fillStyle = "#00ff00";
                    ctx.font = "bold 16px monospace";
                    ctx.fillText(`${DISPLAY_LABEL} (%${Math.round(bestPrediction.confidence * 100)})`, correctedX, topY > 20 ? topY - 10 : 20);
                    
                } else {
                    resultBadge.style.display = "none";
                }
            } catch (inferError) {
                // Frame atlamalarında döngü kırılmasın diye hatayı sessizce yakala
            }
        }

        requestAnimationFrame(detectFrame);
    }

    window.onload = async () => {
        await setupWebcam();
        await loadModel();
    };
</script>

</body>
</html>
